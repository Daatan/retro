name: Tests

# Runs the api/, pipeline/, and bayesoracle/ pytest suites. Triggered directly
# on PRs for fast feedback, and exposed via `workflow_call` so deploy-oracle.yml
# can require it as a gate before shipping to the live Oracle box. No API keys
# or EC2 needed: the suites mock external services, and api/tests/conftest.py
# supplies a dummy ORACLE_API_KEY so settings validation passes.

on:
  # No `paths:` filter here on purpose (retro#963): a workflow skipped by a path filter never
  # reports a check, so a docs-only PR could not satisfy a required status check. The
  # `changes` job below does the path matching instead, and `ci-gate` always reports.
  pull_request:
  workflow_call:

# A new push to a PR supersedes the previous run; never cancel when called from a deploy
# (push to main). The group name differs from deploy-oracle.yml's on purpose — a called
# workflow that shares its caller's group deadlocks.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Same idea as changelog.yml: ask the API for the PR's file list instead of cloning this
    # repo (atlas data commits make a full clone slow, retro#928). Anything that is not a PR
    # (workflow_call from deploy-oracle.yml) always runs everything.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Did code or infra change?
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${PR}/files" --jq '.[].filename')
          # Keep in step with what the test jobs below actually cover. The case studies are
          # hand-edited data validated by test_event_validation.py, hence data/events/.
          if grep -Eq '^(api/|pipeline/|bayesoracle/|metaculus/|polymarket_paper/|manifold_paper/|data/events/|infra/|\.github/workflows/tests\.yml$)' <<<"$CHANGED"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "no tested paths changed — test jobs will be skipped"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  infra-shell-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # ec2_run.sh's sync/re-exec guards (retro#553) only run on the unhappy path
    # and had zero CI coverage before this job — an infra-only change never
    # matched this workflow's path filter at all. See the harness's own header
    # comment (infra/tests/test_ec2_run_guards.sh) for what these guards protect.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: shellcheck ec2_run.sh
        run: shellcheck -S error infra/ec2_run.sh

      - name: shellcheck logs.sh
        run: shellcheck -S error infra/logs.sh

      - name: Run ec2_run.sh guard regression tests
        run: bash infra/tests/test_ec2_run_guards.sh

      # settlement_report.py is the tool that will answer "is it safe to enforce
      # the settlement gates" (retro#691). It runs on EC2, so no pytest suite
      # would ever reach it — these tests feed it synthetic log text here.
      - name: Run settlement_report.py tests
        run: bash infra/tests/test_settlement_report.sh

      # The Metaculus timer units only ever execute on the oracle box, so
      # nothing else in CI would notice a decision in them being undone —
      # notably the poll cadence, which retro#728 exists to correct.
      - name: shellcheck install_metaculus_timer.sh
        run: shellcheck -S error infra/install_metaculus_timer.sh

      - name: Run metaculus-sync systemd unit tests
        run: bash infra/tests/test_metaculus_timer.sh

      - name: shellcheck install_polymarket_paper_timer.sh
        run: shellcheck -S error infra/install_polymarket_paper_timer.sh

      - name: Run polymarket-paper systemd unit tests
        run: bash infra/tests/test_polymarket_paper_timer.sh

      - name: shellcheck install_manifold_paper_timer.sh
        run: shellcheck -S error infra/install_manifold_paper_timer.sh

      - name: Run manifold-paper systemd unit tests
        run: bash infra/tests/test_manifold_paper_timer.sh

      # The node-series cron line only runs on the oracle box (retro#896): pin
      # the every-3-days guard flag and that a deploy never installs it.
      - name: shellcheck install_oracle_series_cron.sh
        run: shellcheck -S error infra/install_oracle_series_cron.sh

      - name: Run oracle-series cron tests
        run: bash infra/tests/test_oracle_series_cron.sh

  pytest:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [api, pipeline, bayesoracle, metaculus, polymarket_paper, manifold_paper]
    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # setup-uv has no moving major tag — pin the exact version.
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run unit tests
        run: uv run pytest tests/ -v --tb=short

  ruff-baseline:
    # Informational only (retro#963): prints per-rule counts with ruff's default rules so there
    # is a number to decide a rule set from. `--exit-zero` and not part of `ci-gate`.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: ruff statistics (non-blocking)
        run: uvx ruff@0.8.6 check --statistics --exit-zero api pipeline

  ruff-lint:
    # Blocking (retro#977): pyflakes rules from ruff.toml. Part of `ci-gate`.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: ruff check
        run: uvx ruff@0.8.6 check api pipeline

  mypy:
    # Blocking (retro#977): type-check api/ and pipeline/ with the [tool.mypy] config in each
    # pyproject.toml. Modules that had errors when the gate landed are listed there with
    # ignore_errors (a ratchet: delete lines, never add). Unlike ruff it needs each project's
    # deps installed to resolve types, hence uv sync rather than uvx. Part of `ci-gate`.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [api, pipeline]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: mypy
        run: uv run mypy

  # The one check `main` should require. Runs even when the test jobs were skipped (docs-only
  # PR) or failed, and is green only if every job it depends on passed or was skipped.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, infra-shell-tests, pytest, ruff-lint, mypy]
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::a required job ended '$r'"; exit 1
            fi
          done
