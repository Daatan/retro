name: PM Analysis Daily Refresh

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # Pinned so an upstream release can't silently break this daily job.
        run: pip install httpx==0.28.1 scipy==1.17.1 numpy==2.4.6

      - name: Fetch node price history
        run: python bayesoracle/fetch_node_history.py

      - name: Recompute edge probabilities
        run: python bayesoracle/compute_edge_probs.py

      - name: Patch index.html and rebuild all.json
        run: python bayesoracle/apply_html_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bayesoracle/
          git diff --staged --quiet || git commit -m "chore(pm-analysis): daily data refresh $(date -u +%Y-%m-%d)"
          git push
