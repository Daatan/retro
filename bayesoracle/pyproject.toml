[project]
name = "bayesoracle"
version = "0.1.0"
description = "BayesOracle — Bayesian DAG propagation engine behind bayes.daatan.com"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
