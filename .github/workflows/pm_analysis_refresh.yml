name: PM Analysis Daily Refresh

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  # Gate: the api/ + pipeline/ + bayesoracle/ suites must pass before we trust
  # today's data run. This is the ONLY gate — see the commit step below for why
  # there is no PR. Mirrors deploy-oracle.yml's use of the same reusable workflow.
  test:
    uses: ./.github/workflows/tests.yml

  refresh:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the explicit deploy-atlas dispatch at the end of this job — a push
      # made with GITHUB_TOKEN does NOT trigger other workflows, so the Pages
      # republish has to be asked for by name. `workflow_dispatch` is the
      # documented exception to that suppression rule.
      actions: write
    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        # Pinned so an upstream release can't silently break this daily job.
        run: pip install httpx==0.28.1 scipy==1.17.1 numpy==2.4.6

      - name: Fetch node price history
        run: python bayesoracle/fetch_node_history.py

      - name: Recompute edge probabilities
        run: python bayesoracle/compute_edge_probs.py

      - name: Patch index.html and rebuild all.json
        run: python bayesoracle/apply_html_data.py

      - name: Validate refresh output
        # Fails closed: a NaN/inf value, an out-of-range probability, or a
        # wildly oversized diff stops here, before anything is committed.
        run: python bayesoracle/validate_refresh.py

      - name: Commit the refreshed data if it changed
        # DELIBERATE, DOCUMENTED EXCEPTION to the repo's PR-only rule — the one
        # automated path allowed to push to `main`, scoped to `bayesoracle/`
        # data files. Why (retro#551): this job used to open a PR, but the
        # Daatan org policy forbids GitHub Actions from creating pull requests
        # ("The organization does not allow GitHub Actions to create or approve
        # pull requests", HTTP 409 — and it cannot be relaxed per-repo). The
        # PR-opening step therefore failed every single day from 2026-08-09 to
        # 2026-08-19 while `test` and `refresh` stayed green, leaving ten
        # orphaned branches and the public bayes.daatan.com data stale for ten
        # days. Silent staleness is worse than an unreviewed data commit.
        #
        # What still protects `main` (both #430's original asks, unchanged):
        #   1. `tests.yml` — the full api/pipeline/bayesoracle suites, above.
        #   2. `validate_refresh.py` — fails closed on NaN/inf, out-of-range
        #      probabilities, or an oversized diff, before anything is staged.
        # Only `bayesoracle/` is ever staged, so a compromised or buggy run
        # cannot reach code paths outside the data it recomputes.
        #
        # Restore the PR flow the moment a token that may open PRs exists (a
        # GitHub App installation token or a fine-grained PAT in `GH_TOKEN`) —
        # that is the preferred end state, tracked in retro#551.
        id: diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bayesoracle/
          if git diff --staged --quiet; then
            echo "No changes — skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(pm-analysis): daily data refresh $(date -u +%Y-%m-%d)"
          # `main` can move under a ~10-minute run (the atlas pipeline commits
          # here too), so rebase-then-push, once, rather than failing the day.
          for attempt in 1 2; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase origin main
          done
          echo "::error::could not push the refresh to main after 2 attempts"
          exit 1

      - name: Republish the Pages site
        # deploy-atlas.yml normally fires on `push` to main under bayesoracle/**,
        # but GitHub suppresses workflow runs caused by a GITHUB_TOKEN push — so
        # without this the data would land on main and bayes.daatan.com would
        # keep serving yesterday's numbers, which is the silent-staleness bug
        # retro#551 is about. workflow_dispatch is exempt from the suppression.
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-atlas.yml --ref main
