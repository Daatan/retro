# retro#943 — abbreviation-safe sentence splitter for the Jev gate, shadow and class corrector.
# Drop-in, deliberately NOT synced by infra/deploy_oracle.sh: copy it onto the box by hand to
# start, delete it to stop.
#   sudo cp jev-segment-v2.conf /etc/systemd/system/oracle-api.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart oracle-api
# Mark's call 2026-10-16. Evidence: live A/B on 23 articles whose segmentation changed —
# 0 gate flips at the live JEV_GATE_THRESHOLD=0.07, 1 flip at 0.15 (0.16 -> 0.15), `neg`
# unchanged in every article. Not measured: Jev's run-to-run noise, so some larger
# max_noul shifts in that A/B may be noise rather than an effect of v2.
# Rollback: delete the drop-in on the host, daemon-reload, restart oracle-api.
[Service]
Environment=JEV_SEGMENT_V2=true
