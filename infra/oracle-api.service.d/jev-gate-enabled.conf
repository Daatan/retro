[Service]
# retro#850: Jev skip-gate in front of the Haiku extractor on /forecast — SHADOW step.
# With this flag pass 1 (one noul per sentence, the call jev-shadow-enabled.conf's
# shadow already makes) runs on every article that clears the gatekeeper and logs one
# `event=jev_gate would_skip=…` line next to how many claims Haiku then found, with
# the article's script so the threshold can be read per language. Nothing is skipped:
# that needs JEV_GATE_ENFORCE=true as well, a separate decision after >= 1 week of
# shadow log. Fail-open — no key / Jev down / timeout always extracts.
#
# Key: SSM SecureString /retro/prod/secrets/TYPESAFE_API_KEY, same as the shadow.
#
# Like the other drop-ins, infra/deploy_oracle.sh does not sync this file; see
# precursor-match-enabled.conf for the one-time manual sync (copy to
# /etc/systemd/system/oracle-api.service.d/, daemon-reload, restart oracle-api).
# Rollback: delete the drop-in on the host, daemon-reload, restart oracle-api.
Environment=JEV_GATE_ENABLED=true
