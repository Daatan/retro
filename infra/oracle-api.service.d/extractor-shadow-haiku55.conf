[Service]
# retro#921: shadow-run Claude Haiku 5.5 beside the live Haiku 4.5 extractor on /forecast.
# Log-only — one `event=extractor_shadow` line per article, never read by pricing or the
# response. Costs ~one extra (cheaper) extraction per live article; read the result with
# `grep event=extractor_shadow /home/ubuntu/truthmachine/oracle_log.txt`.
#
# Like the other drop-ins, infra/deploy_oracle.sh does not sync this file; see
# precursor-match-enabled.conf for the one-time manual sync (copy to
# /etc/systemd/system/oracle-api.service.d/, daemon-reload, restart oracle-api).
# Rollback: delete the drop-in on the host, daemon-reload, restart oracle-api.
Environment=EXTRACTOR_SHADOW_MODEL=bedrock/us.anthropic.claude-haiku-5-5
