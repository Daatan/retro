[Service]
# retro#621 rung 1 (PR#648, merged 2026-08-24) shipped the retry-relaxed-search
# fallback shadow/log-only, off by default (config.py). Mark approved enabling
# it here (2026-08-26) to start collecting `event=retry_relaxed_search` shadow
# data — before this, zero shadow data existed at all (see issue comment
# 2026-08-26).
#
# This only fires when Oracle's primary search returns no usable prediction
# (outcome=no_usable_predictions, ~30% of prod calls per #617). It logs the
# retry's outcome; it never changes what gets returned this rung
# (retry_relaxed_search_enforce stays False, unread).
#
# NOTE: this file being present in the repo does NOT make it live on its own —
# infra/deploy_oracle.sh does not sync systemd unit/drop-in files on every
# deploy (see docs/ORACLE_DEPLOY.md), only application code. Applying this
# requires the manual step below, same shape as precursor-match-enabled.conf's
# rollout:
#
#   aws ssm send-command --region eu-central-1 --instance-ids i-00ac444b94c5ff9b2 \
#     --document-name AWS-RunShellScript --comment "sync retry-relaxed-search-enabled drop-in" \
#     --parameters 'commands=[
#       "sudo mkdir -p /etc/systemd/system/oracle-api.service.d",
#       "sudo cp /home/ubuntu/oracle-api/infra/oracle-api.service.d/retry-relaxed-search-enabled.conf /etc/systemd/system/oracle-api.service.d/retry-relaxed-search-enabled.conf",
#       "sudo systemctl daemon-reload",
#       "sudo systemctl restart oracle-api"
#     ]'
#
# This file existing here is the source of truth for what SHOULD be live — it
# may still drift from the host until the command above (or an equivalent) is
# run. Rollback: delete the drop-in on the host, daemon-reload, restart
# oracle-api — reverts to config.py's False default, same as before this file
# existed.
Environment=RETRY_RELAXED_SEARCH_ENABLED=true
