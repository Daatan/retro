[Service]
# retro#608 slice 1 (PR#611, merged 2026-08-23) shipped the precursor
# candidate-match check shadow/log-only, off by default (config.py:585). Mark
# held off turning it on (2026-08-23) until asked again, then approved
# enabling it here (2026-08-26) to start collecting `event=precursor_match`
# shadow data for a precision review.
#
# This only affects api/src/forecast_api/v2_playground.py — the Oracle 2.0
# playground (/oracle-v2-test.html, key-gated), not the main /forecast v1
# production path. It logs a typed relation verdict per candidate found; it
# never changes pricing, recursion, or the propagated result this slice
# (precursor_match_enforce stays False, unread).
#
# NOTE: this file being present in the repo does NOT make it live on its own —
# infra/deploy_oracle.sh does not sync systemd unit/drop-in files on every
# deploy (see docs/ORACLE_DEPLOY.md), only application code. Applying this
# requires the manual step below, same shape as extractor-model.conf's rollout:
#
#   aws ssm send-command --region eu-central-1 --instance-ids i-00ac444b94c5ff9b2 \
#     --document-name AWS-RunShellScript --comment "sync precursor-match-enabled drop-in" \
#     --parameters 'commands=[
#       "sudo mkdir -p /etc/systemd/system/oracle-api.service.d",
#       "sudo cp /home/ubuntu/oracle-api/infra/oracle-api.service.d/precursor-match-enabled.conf /etc/systemd/system/oracle-api.service.d/precursor-match-enabled.conf",
#       "sudo systemctl daemon-reload",
#       "sudo systemctl restart oracle-api"
#     ]'
#
# This file existing here is the source of truth for what SHOULD be live — it
# may still drift from the host until the command above (or an equivalent) is
# run. Rollback: delete the drop-in on the host, daemon-reload, restart
# oracle-api — reverts to config.py's False default, same as before this file
# existed.
Environment=PRECURSOR_MATCH_ENABLED=true
