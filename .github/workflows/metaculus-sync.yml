name: Metaculus Sync

# Submits Oracle forecasts into a Metaculus tournament under the daatan-v1
# bot account (daatan#1554). Deliberately points at the unscored
# "bot-testing-area" tournament by default — see metaculus/README.md for why,
# and for what's still missing before this can run for real (the oracle-api
# named relay key isn't provisioned yet, so this workflow is not yet enabled
# on a schedule).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log what would be submitted without writing to Metaculus"
        type: boolean
        default: true
  # No `schedule:` trigger until the oracle-api relay key exists (retro#725)
  # and a manual dry run has been verified clean (retro#727) — a cron enabled
  # before then just fails every 20 minutes.
  #
  # When enabling, the cadence is ~20 minutes, NOT the 6 hours an earlier
  # version of this comment proposed. That figure assumed Oracle's /forecast
  # was a multi-minute call; retro#617 has since measured it over n=20,000
  # production forecasts — p50 7.3s, p99 25.0s, max 45.9s, zero timeouts.
  # Tournament questions close 1.5h (temporarily 3h) after opening, so a 6h
  # cron misses most of them outright while 20 minutes is easily affordable:
  #
  #   schedule:
  #     - cron: "*/20 * * * *"
  #
  # Note GitHub Actions cron is both delayed under load and the reason
  # Metaculus temporarily widened the window to 3h; retro#728 tracks moving
  # discovery to a systemd timer on the oracle box instead.

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  sync:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: metaculus
        run: uv sync --frozen --extra dev

      - name: Run sync
        working-directory: metaculus
        env:
          METACULUS_API_KEY: ${{ secrets.METACULUS_ORACLE_V1_API_KEY }}
          ORACLE_API_KEY: ${{ secrets.ORACLE_RELAY_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: uv run python sync.py
