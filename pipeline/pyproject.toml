[project]
name = "truthmachine-pipeline"
version = "1.4.0"
description = "TruthMachine — retroactive media prediction analysis pipeline"
requires-python = ">=3.11"
dependencies = [
    # <1.16: instructor 1.16 rewrote its providers (v2) and changed the MD_JSON system
    # text wrapped around our schema on every Bedrock call -- a prompt edit, so it goes
    # through the A/B harness, not a Dependabot bump (retro#1001).
    "instructor>=1.7.0,<1.16",
    "litellm>=1.50.0",
    "boto3>=1.34.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    "lightgbm>=4.0.0",
    "numpy>=1.26.0",
    "beautifulsoup4>=4.14.3",
    "ddgs>=9.0.0",
    "trafilatura>=2.0.0",
    "openskill>=6.0.0",
    "pyyaml>=6.0.0",
    "google-cloud-bigquery>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy==2.4.0",  # type-check gate (retro#977); pinned like ruff, a bump changes the error set
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Blocking type-check gate (retro#977), run by the `mypy` job in tests.yml, part of `ci-gate`.
# Lenient on purpose: third-party stubs are not required, and unannotated functions are not an
# error (disallow_untyped_defs would add ~55 no-untyped-def hits per package). Every module is
# checked except the allowlist below, so a new file must type-check from day one.
[tool.mypy]
files = ["src/tm"]
ignore_missing_imports = true
check_untyped_defs = true

# Ratchet: modules that had mypy errors when the gate landed (2026-10-21, mypy 2.4.0,
# 51 errors total; count per module in the comment). Fix a module, delete its line, never
# add one. Blind spot: new errors inside a listed module are not caught until it is removed.
[[tool.mypy.overrides]]
module = [
    "tm.ab_harness",  # 1
    "tm.aggregator",  # 1
    "tm.backtest",  # 11
    "tm.crawler",  # 2
    "tm.extractor",  # 1
    "tm.gdelt_bq_ingest",  # 1
    "tm.gdelt_ingest",  # 1
    "tm.gnews_ingest",  # 2
    "tm.llm",  # 2
    "tm.orchestrator",  # 1
    "tm.scorer",  # 6
    "tm.site_search",  # 19
    "tm.web_search",  # 1
    "tm.web_search_ingest",  # 2
]
ignore_errors = true
