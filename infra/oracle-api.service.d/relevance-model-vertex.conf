[Service]
# retro#1038: moves ONLY /relevance (the gatekeeper news-indexer's judge calls) from Nova Micro to
# Gemini 3.5 Flash-Lite on Vertex AI. Same prompt (tm/gatekeeper.py). /forecast's gatekeeper and the
# batch pipeline keep GATEKEEPER_MODEL (Nova Micro). No code change: litellm dispatches by the
# `vertex_ai/` prefix and reads the three VERTEX*/GOOGLE_* vars below.
#
# Why (2026-10-30, 400 prod relevance_judgment pairs re-judged with the current prompt): Nova passed
# 148, Gemini 21. The 128 pairs only Nova passed were noise, with invented links at relevance
# 0.3-0.5. The calls bill against the GCP startup credit (docs#229).
#
# Credential: Workload Identity Federation from the EC2 instance role. The file below is a
# credential CONFIG (pool/provider/SA ids + the IMDSv2 URLs), not a key, and it holds no secret.
# Runbook: retro#1038. Zero-cost check on the box before restarting:
#   sudo -u ubuntu env GOOGLE_APPLICATION_CREDENTIALS=<path> /home/ubuntu/oracle-api/api/.venv/bin/python \
#     -c "import google.auth,google.auth.transport.requests as r;c,p=google.auth.default(scopes=['https://www.googleapis.com/auth/cloud-platform']);c.refresh(r.Request());print(p,'ok')"
#
# NOT synced by deploy (docs/ORACLE_DEPLOY.md, "systemd drop-ins"). Apply it by hand:
#   sudo cp /home/ubuntu/oracle-api/infra/oracle-api.service.d/relevance-model-vertex.conf /etc/systemd/system/oracle-api.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart oracle-api   # restart, not reload: env changes need it
# Verify: news-indexer relevance_judgment.model shows vertex_ai/gemini-3.5-flash-lite on new rows.
# Rollback: delete the file on the host, daemon-reload, restart. /relevance is back on Nova Micro.
#
# Failure mode: if Vertex auth breaks, /relevance returns 502. news-indexer treats that as "no
# verdict" (transient) and records nothing. It does NOT fall back to Nova, so the outage shows up
# as judge_v2 retries instead of being masked.
Environment=RELEVANCE_MODEL=vertex_ai/gemini-3.5-flash-lite
Environment=VERTEXAI_PROJECT=daatan
Environment=VERTEXAI_LOCATION=global
Environment=GOOGLE_APPLICATION_CREDENTIALS=/home/ubuntu/.config/gcloud/oracul-wif.json
