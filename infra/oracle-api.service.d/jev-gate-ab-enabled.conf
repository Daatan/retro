# retro#849 — pass-1 question-text A/B, log only. Drop-in, deliberately NOT synced by
# infra/deploy_oracle.sh: copy it onto the box by hand to start the A/B, delete it to stop.
#   sudo cp jev-gate-ab-enabled.conf /etc/systemd/system/oracle-api.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart oracle-api
# Requires JEV_GATE_ENABLED=true as well: the A/B is logged from the gate's own code path.
[Service]
Environment=JEV_GATE_AB_ENABLED=true
