[Service]
# retro#840: Jev (TypeSafe System One) shadow extraction next to the live Haiku
# extractor on /forecast. Shadow/log-only — one `event=jev_shadow` line per article,
# never read by pricing or the response. Mark asked for it on (2026-09-22).
#
# The key is not here: jev_shadow.py reads the SSM SecureString
# /retro/prod/secrets/TYPESAFE_API_KEY (the instance role already reads
# /retro/prod/secrets/*). Without it every article logs `skip=no_key`.
#
# Like the other drop-ins, infra/deploy_oracle.sh does not sync this file; see
# precursor-match-enabled.conf for the one-time manual sync (copy to
# /etc/systemd/system/oracle-api.service.d/, daemon-reload, restart oracle-api).
# Rollback: delete the drop-in on the host, daemon-reload, restart oracle-api.
Environment=JEV_SHADOW_ENABLED=true
