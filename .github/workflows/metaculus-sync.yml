name: Metaculus Sync

# Submits Oracle forecasts into a Metaculus tournament under the daatan-v1
# bot account (daatan#1554). Deliberately points at the unscored
# "bot-testing-area" tournament by default — see metaculus/README.md for why,
# and for what's still missing before this can run for real (the oracle-api
# named relay key isn't provisioned yet, so this workflow is not yet enabled
# on a schedule).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log what would be submitted without writing to Metaculus"
        type: boolean
        default: true
  # NO `schedule:` TRIGGER HERE — BY DECISION, NOT BY OMISSION (retro#728).
  #
  # Discovery is scheduled by a systemd timer on the oracle box instead:
  # `infra/metaculus-sync.timer`, every 20 minutes, installed with
  # `infra/install_metaculus_timer.sh`. Do not add a cron here as well — two
  # schedulers would double-submit into the same question window.
  #
  # Why not Actions cron: it is delayed and skipped under load, and that
  # unreliability is the stated reason Metaculus temporarily widened the
  # question window from 1.5h to 3h. Scheduling our discovery on the same
  # substrate would inherit exactly the risk the widening exists to absorb, and
  # on a 1.5h window a missed poll is a forfeited question.
  #
  # Why 20 minutes: questions close 1.5h (temporarily 3h) after opening, so the
  # 6h cadence an earlier version of this comment proposed would miss most of
  # them. That figure assumed /forecast was a multi-minute call; retro#617 has
  # since measured it over n=20,000 production forecasts — p50 7.3s, p99 25.0s,
  # max 45.9s, zero timeouts.
  #
  # This workflow stays `workflow_dispatch`-only, which is still the right way
  # to run a manual dry run (retro#727) without touching the box.

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  sync:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: metaculus
        run: uv sync --frozen --extra dev

      - name: Run sync
        working-directory: metaculus
        env:
          METACULUS_API_KEY: ${{ secrets.METACULUS_ORACLE_V1_API_KEY }}
          ORACLE_API_KEY: ${{ secrets.ORACLE_RELAY_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: uv run python sync.py
