[Service]
# retro#1098: bills /relevance's Gemini calls at Vertex AI Flex PayGo, half price (3.5 Flash-Lite:
# $0.15/$1.25 per 1M in/out vs $0.30/$2.50). Same model, same prompt, same verdicts. short_form
# requests only (news-indexer's short_form lane, ~97% of the calls); the cosine lane, ~75% of
# deliveries, keeps the standard tier (Mark, 2026-11-22). The cost is
# latency: ~7-10 s instead of ~1 s (measured 2026-11-22). Any failure of the Flex attempt (429,
# 503, the RELEVANCE_FLEX_TIMEOUT_SECONDS timeout) falls back to one standard call, so a capacity
# shortage costs money, not a verdict. Needs relevance-model-vertex.conf: no other model has a Flex
# tier, and with a Bedrock RELEVANCE_MODEL this file changes nothing.
#
# ORDER MATTERS. Apply only after news-indexer judges with lane concurrency (ni#547) deployed and
# its client timeout above RELEVANCE_FLEX_TIMEOUT_SECONDS. A sequential judge loop at ~8 s a call
# would fall ~3x behind the short_form queue.
#
# NOT synced by deploy (docs/ORACLE_DEPLOY.md, "systemd drop-ins"). Apply it by hand:
#   sudo cp /home/ubuntu/oracle-api/infra/oracle-api.service.d/relevance-flex.conf /etc/systemd/system/oracle-api.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart oracle-api   # restart, not reload: env changes need it
# Verify: the startup line `event=relevance_config ... flex=True` in oracle_log.txt, then one
# `event=flex_stats attempts=500 flex=… not_flex=… fallback=… window_answered=… mean_s=… max_s=…`
# line per 500 calls. `not_flex` > 0 means the headers are being ignored and nothing is saved;
# `fallback` is what Flex capacity costs. `mean_s` is answered-Flex latency for the window:
# news-indexer's short_form lane holds its 30/min with 6 in flight only up to ~12 s, so a mean
# above that means it falls behind (raise JUDGE_V2_LANE_CONCURRENCY there, or roll back here).
# Rollback: delete the file on the host, daemon-reload, restart.
Environment=RELEVANCE_FLEX_ENABLED=true
Environment=RELEVANCE_FLEX_TIMEOUT_SECONDS=25
