version: "3.9"

services:
  truthmachine-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truthmachine-pipeline
    init: true # tail -f /dev/null as PID 1 ignores SIGTERM without this — `down` would otherwise hang the full stop timeout
    volumes:
      - .:/app
      - ../data:/app/data
    env_file:
      - .env
    network_mode: host # Allows access to local LiteLLM proxy if running
