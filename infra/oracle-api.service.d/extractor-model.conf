[Service]
# Overrides tm/config.py's Nova Lite default for THIS service only (oracle-api, the
# live real-time /forecast path). The batch truthmachine.service deliberately does
# NOT get this override and stays on Nova Lite — see CLAUDE.md's infra cheat-sheet
# and infra/iam/README.md §4.
#
# Why Haiku: a 2026-07-11/12 A/B test on an adjacent-event confusion incident
# (see docs/ORACLE_VARIABLES.md) measured Nova Lite failing 8/10 (with prompt
# hardening) vs. Haiku 4.5 at 0/10. This is a deliberate quality-over-cost choice,
# not a default — re-evaluate against docs/PROMPT_CACHING.md's cost analysis before
# changing it.
#
# NOTE: this file being present in the repo does NOT make it live on its own —
# infra/deploy_oracle.sh does not sync systemd unit/drop-in files on every deploy
# (see docs/ORACLE_DEPLOY.md), only application code. Applying a change to this file
# requires the manual step below, same as the original 2026-07-12 rollout:
#
#   aws ssm send-command --region eu-central-1 --instance-ids i-00ac444b94c5ff9b2 \
#     --document-name AWS-RunShellScript --comment "sync extractor-model drop-in" \
#     --parameters 'commands=[
#       "sudo mkdir -p /etc/systemd/system/oracle-api.service.d",
#       "sudo cp /home/ubuntu/oracle-api/infra/oracle-api.service.d/extractor-model.conf /etc/systemd/system/oracle-api.service.d/extractor-model.conf",
#       "sudo systemctl daemon-reload",
#       "sudo systemctl restart oracle-api"
#     ]'
#
# This file existing here is the source of truth for what SHOULD be live — it may
# still drift from the host until the command above (or an equivalent) is run.
# Rollback: delete the drop-in on the host, daemon-reload, restart oracle-api.
Environment=EXTRACTOR_MODEL=bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
