[project]
name = "metaculus-sync"
version = "0.1.0"
description = "Submits Daatan Oracle forecasts into Metaculus tournaments (daatan-v1 bot)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
