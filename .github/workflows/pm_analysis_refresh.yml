name: PM Analysis Daily Refresh

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        # Pinned so an upstream release can't silently break this daily job.
        run: pip install httpx==0.28.1 scipy==1.17.1 numpy==2.4.6

      - name: Fetch node price history
        run: python bayesoracle/fetch_node_history.py

      - name: Recompute edge probabilities
        run: python bayesoracle/compute_edge_probs.py

      - name: Validate computed edge weights
        # Catches a NaN/inf regression fallback before it's baked into
        # index.html as an invalid JS token (retro#430) — fails the job
        # (and therefore skips opening a PR) rather than shipping it.
        run: python bayesoracle/validate_edge_weights.py

      - name: Patch index.html and rebuild all.json
        run: python bayesoracle/apply_html_data.py

      - name: Open a PR with the refreshed data
        # PR-only, like every other change in this repo (workspace CLAUDE.md) —
        # this used to commit straight to main with no test gate at all
        # (retro#430). Reuses one rolling branch so an unmerged previous
        # day's refresh is superseded by today's rather than piling up PRs.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bayesoracle/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          BRANCH="pm-analysis-refresh"
          git checkout -B "$BRANCH"
          git commit -m "chore(pm-analysis): daily data refresh $(date -u +%Y-%m-%d)"
          git push --force origin "$BRANCH"
          if [ "$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null)" != "OPEN" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(pm-analysis): daily data refresh $(date -u +%Y-%m-%d)" \
              --body "Automated daily PM-analysis data refresh. \`validate_edge_weights.py\` already passed (a prerequisite step in this job); \`tests.yml\` (including the \`bayesoracle\` job) runs as a normal PR check on top of that."
          fi
